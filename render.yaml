services:
  - type: web
    name: cold-call-copilot-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-3.5-transcribe-live
      - key: GEMINI_LIVE_MODEL
        value: gemini-3.5-transcribe-live
      - key: SUPABASE_URL
        value: https://rduxyhkwgykejczxircd.supabase.co
      - key: CORS_ORIGINS
        value: https://cold-call-copilot-gamma.vercel.app,http://localhost:3000,http://localhost:5173
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
